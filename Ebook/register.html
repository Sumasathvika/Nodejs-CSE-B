<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="style.css">
<body>
    <style>
        body{
            background-color: rgba(100, 13, 214, 0.114);
        }
    </style>

    <center><h1>REGISTER PAGE</h1>
        
         <div>
            <form action="register.html" method="post">
                <style>
                    form{
                        background-color: rgb(255, 93, 174);
                      
                    }
                    label{
                        color: aliceblue;
                    }
                </style>
                 <label for="Full Name">Full Name:</label>
                 <input type="text" id="fullname" name="fullname" required><br>
                 <label for="Password">Password</label>
                 <input type="text" id="password" name="password" required><br>
                  <label for="Email">Email:</label>
                  <input type="text" id="email" name="email" required><br>
                  <label for="Mobile number">Mobile Number:</label>
                  <input tyoe="number" id="mobile number" name="mobile number" required><br>
                  <label for="Date of Birth">Date of Birth:</label>
                  <input type="Date" id="date of birth" name="date of birth" required><br>
                  <label for="Gender">Gender:</label>
                  <input type="radio" id="gender" name="gender" required><br>
                  <label for="Hobbies">Hobbies:</label>
                  <input type="checkbox" id="hobbies" name="hobbies" required><br>
                  <label for="Country">Country:</label>
                  <input type="text" id="Country" name="Country" required>
                  <select name="Country" id="Country" required>
                    <option value="India">India</option>
                    <option value="USA">USA</option>
                    <option value="UK">UK</option>
                    <option value="Canada">Canada</option>
                  </select>
                  <br><label for="Address">Address:</label>
                  <input type="text" id="address" name="address" required><br>
                  <label for="Favourite color">Favourite color:</label>
                  <input type="color" id="Favourite color" name="Favourite color" required><br>
                  <label for="Website">Website:</label>
                  <input type="url" id="website" name="website" required><br>
                  <label for="Searchbar">Searchbar:</label>
                  <input type="search" id="Searchbar" name="Searchbar" required><br>
                  <label for="Image">Image:</label>
                  <input type="file" id="Image" name="Image" required><br>
                  <label>Registration Details:</label>
                  <input type="time" name="time"><br>
                  <input type="month" name="month"><br>
                   <input type="week" name="week"><br>
                   <label for="experience">Experience:</label>
                   <input type="range" id="experience" name="experience" min="0" max="10" value="5">
                   <input type="submit" value="Register" style="padding: 10px;margin-bottom: 15px;"><br>
                   <label for="reset">Reset:</label>
                   <input type="button" value="Reset" style="padding: 10px;margin-bottom: 15px;"><br>
                   
                   <label for="submit">Submit:</label>
                   <input type="button" value="Submit"><br>
                   

        
            </form>
            
        </div>
    </center>
</body>
</html>
